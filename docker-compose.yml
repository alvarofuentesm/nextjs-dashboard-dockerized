services:
  next-app:
    container_name: nextjs-docker
    build:
      context: .
      dockerfile: Dockerfile.dev

    env_file:
      - .env.local
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - 3000:3000
    depends_on:
      - next_db

  next_db:
    container_name: nextjs-docker-db
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: "next_db"
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5433:5432"
    volumes:
      - ./data/nextdb/postgres/:/var/lib/postgresql
    user: 1000:1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

